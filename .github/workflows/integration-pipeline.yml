# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                    🌟 E&L DIGITAL CLIENT PLATFORM                             ║
# ║                    Comprehensive Integration Pipeline                         ║
# ╠═══════════════════════════════════════════════════════════════════════════════╣
# ║  ⚠️  MANUAL TRIGGER ONLY - Run when your code is ready                       ║
# ║  Flow: source_branch → integrations → developer (with version bump)         ║
# ║  Target Host: eandl.digital & eandl.digital/portal                            ║
# ║                                                                                ║
# ║  Versioning: MAJOR.MINOR.PATCH semantic versioning                            ║
# ║    • feature  = MAJOR bump (1.0.0 → 2.0.0)                                    ║
# ║    • bugfix   = PATCH bump (1.0.0 → 1.0.1)                                    ║
# ║    • security = PATCH bump (1.0.0 → 1.0.1)                                    ║
# ║    • system   = MINOR bump (1.0.0 → 1.1.0)                                    ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

name: 🔄 E&L Client Portal Integration Pipeline

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "🌿 Source branch to build and merge"
        required: true
        type: string
        default: "feature/portal-update"
      update_type:
        description: "📋 Update type (determines version bump)"
        required: true
        type: choice
        options:
          - feature
          - bugfix
          - security
          - system
        default: bugfix
      delete_branch:
        description: "🗑️ Delete source branch after merge?"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "20"
  INTEGRATION_BRANCH: "integrations"
  DEVELOPER_BRANCH: "developer"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # 📋 SETUP & VALIDATION
  # ═══════════════════════════════════════════════════════════════════════════════
  setup:
    name: 📋 Setup & Analyze
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.branch.outputs.name }}
      update_type: ${{ steps.branch.outputs.update_type }}
      is_feature: ${{ steps.branch.outputs.is_feature }}
      is_security: ${{ steps.branch.outputs.is_security }}
      should_promote: ${{ steps.check.outputs.should_promote }}
      version_bump: ${{ steps.branch.outputs.version_bump }}
      delete_branch: ${{ steps.branch.outputs.delete_branch }}
    steps:
      - name: 🔍 Extract Branch Info & Determine Update Type
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.source_branch }}"
          UPDATE_TYPE="${{ github.event.inputs.update_type }}"
          DELETE_BRANCH="${{ github.event.inputs.delete_branch }}"

          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🔍 E&L CLIENT PORTAL PIPELINE INITIALIZATION                ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  🌿 Source Branch: $BRANCH"
          echo "║  📋 Update Type:   $UPDATE_TYPE"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          echo "update_type=$UPDATE_TYPE" >> $GITHUB_OUTPUT
          echo "delete_branch=$DELETE_BRANCH" >> $GITHUB_OUTPUT

          if [ "$UPDATE_TYPE" == "feature" ]; then
            echo "is_feature=true" >> $GITHUB_OUTPUT
            echo "version_bump=major" >> $GITHUB_OUTPUT
          elif [ "$UPDATE_TYPE" == "system" ]; then
            echo "is_feature=false" >> $GITHUB_OUTPUT
            echo "version_bump=minor" >> $GITHUB_OUTPUT
          elif [ "$UPDATE_TYPE" == "security" ]; then
            echo "is_feature=false" >> $GITHUB_OUTPUT
            echo "is_security=true" >> $GITHUB_OUTPUT
            echo "version_bump=patch" >> $GITHUB_OUTPUT
          else
            echo "is_feature=false" >> $GITHUB_OUTPUT
            echo "version_bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0

      - name: 🔍 Check Branch Exists
        id: check
        run: |
          echo "should_promote=true" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🔨 BUILD APPLICATION (TANSTACK START + NITRO)
  # ═══════════════════════════════════════════════════════════════════════════════
  build:
    name: 🔨 Build Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout Source Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch_name }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 🔨 Build Application
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  🔨 Building E&L Client Portal...        ║"
          echo "╚══════════════════════════════════════════╝"
          npm run build
        env:
          CI: true

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portal-output
          path: .output/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🔍 LINTING AND STATIC ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Code Quality & Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout Source Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch_name }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 🔍 Run Linter (ESLint)
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  🔍 Running ESLint...                    ║"
          echo "╚══════════════════════════════════════════╝"
          npm run lint 2>&1 | tee lint-output.txt || true

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🧪 TEST SUITE (VITEST)
  # ═══════════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: 🧪 Vitest Suite
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - name: 📥 Checkout Source Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.branch_name }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 🧪 Execute Vitest
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║  🧪 Running Vitest Suite...              ║"
          echo "╚══════════════════════════════════════════╝"
          npm test

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🔀 MERGE TO INTEGRATIONS BRANCH
  # ═══════════════════════════════════════════════════════════════════════════════
  merge-to-integration:
    name: 🔀 Merge to Integrations
    runs-on: ubuntu-latest
    needs: [setup, integration-tests]
    if: needs.setup.outputs.should_promote == 'true'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔀 Merge Source to Integrations
        run: |
          SOURCE_BRANCH="${{ needs.setup.outputs.branch_name }}"
          git checkout -B ${{ env.INTEGRATION_BRANCH }} origin/${{ env.INTEGRATION_BRANCH }} || git checkout -b ${{ env.INTEGRATION_BRANCH }}
          git merge "origin/$SOURCE_BRANCH" -m "🔀 Merge '$SOURCE_BRANCH' into ${{ env.INTEGRATION_BRANCH }} [skip ci]"
          git push origin ${{ env.INTEGRATION_BRANCH }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🚀 PROMOTE TO DEVELOPER BRANCH
  # ═══════════════════════════════════════════════════════════════════════════════
  promote-to-developer:
    name: 🚀 Promote to Developer
    runs-on: ubuntu-latest
    needs: [setup, merge-to-integration]
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🏷️ Calculate & Apply Version Bump
        id: version
        run: |
          git checkout -B ${{ env.DEVELOPER_BRANCH }} origin/${{ env.DEVELOPER_BRANCH }} || git checkout -b ${{ env.DEVELOPER_BRANCH }}
          git merge origin/${{ env.INTEGRATION_BRANCH }} --ff-only || git merge origin/${{ env.INTEGRATION_BRANCH }} -m "🔀 Sync integrations to developer"

          CURRENT_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          BUMP="${{ needs.setup.outputs.version_bump }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          if [ "$BUMP" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          npm version "$NEW_VERSION" --no-git-tag-version

          echo "Current: $CURRENT_VERSION -> New: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Push to Developer Branch
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "🚀 Promote to developer v$NEW_VERSION [skip ci]" || echo "No commit needed"
          git push origin ${{ env.DEVELOPER_BRANCH }}

      - name: 📊 Pipeline Summary
        run: |
          echo "## 🚀 E&L Client Portal Integration Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Integrations | ✅ Merged | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Developer | ✅ Promoted | \`v${{ steps.version.outputs.new_version }}\` |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🚨 NOTIFICATIONS & CLEANUP
  # ═══════════════════════════════════════════════════════════════════════════════
  notify-failure:
    name: 🚨 Notify Failure
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: failure()
    steps:
      - name: 🚨 Generate Failure Report
        run: |
          echo "## 🚨 E&L Client Portal Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check Vitest / build logs above. Run \`npm test\` locally." >> $GITHUB_STEP_SUMMARY

  notify-success:
    name: ✅ Notify Success
    runs-on: ubuntu-latest
    needs: [promote-to-developer]
    if: needs.promote-to-developer.result == 'success'
    steps:
      - name: ✅ Generate Success Report
        run: |
          echo "## ✅ E&L Client Portal Pipeline Successfully Completed!" >> $GITHUB_STEP_SUMMARY

  cleanup-branch:
    name: 🧹 Cleanup Source Branch
    runs-on: ubuntu-latest
    needs: [promote-to-developer, setup]
    if: ${{ needs.promote-to-developer.result == 'success' && needs.setup.outputs.delete_branch == 'true' }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🗑️ Delete Source Branch
        run: |
          BRANCH_NAME="${{ needs.setup.outputs.branch_name }}"
          git push origin --delete "$BRANCH_NAME" || echo "Branch already deleted or protected"
